name: telegram github opencollective report
on:
  schedule:
    - cron: "0 13 26 * *"

jobs:
  build:
    env:
      TELEGRAM_SEND_GATE_ENABLED: ${{ vars.TELEGRAM_SEND_GATE_ENABLED || 'true' }}
      TELEGRAM_SEND_GATE_LOOKBACK_MESSAGES: ${{ vars.TELEGRAM_SEND_GATE_LOOKBACK_MESSAGES || '5' }}
      TELEGRAM_SEND_GATE_MIN_HUMAN_MESSAGES: ${{ vars.TELEGRAM_SEND_GATE_MIN_HUMAN_MESSAGES || '1' }}
      TELEGRAM_SEND_GATE_ON_ERROR: ${{ vars.TELEGRAM_SEND_GATE_ON_ERROR || 'skip' }}
    defaults:
      run:
        working-directory: ./.github/workflows/opencollective_contributions

    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: get contribution report
        shell: bash
        run: |
          ./get_opencollective_info.sh > contributions_report_message

      - name: check if osscameroon group allows bot posting
        id: telegram_send_gate_opencollective
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_OSSCAMEROON_GROUP_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: "$GITHUB_WORKSPACE/.github/workflows/telegram_send_gate.sh"

      - name: send opencollective contribution report to osscameroon channel
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_OSSCAMEROON_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: MarkdownV2
          message_file: ./.github/workflows/opencollective_contributions/contributions_report_message

      - name: send opencollective contribution report to osscameroon group
        if: ${{ steps.telegram_send_gate_opencollective.outputs.telegram_send_gate == 'true' }}
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_OSSCAMEROON_GROUP_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: MarkdownV2
          message_file: ./.github/workflows/opencollective_contributions/contributions_report_message
