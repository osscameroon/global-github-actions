name: telegram recommend yotas issues
on:
  schedule:
    - cron: "30 10 * * 5,6,0"

jobs:
  build:
    env:
      TELEGRAM_SEND_GATE_ENABLED: ${{ vars.TELEGRAM_SEND_GATE_ENABLED || 'true' }}
      TELEGRAM_SEND_GATE_LOOKBACK_MESSAGES: ${{ vars.TELEGRAM_SEND_GATE_LOOKBACK_MESSAGES || '5' }}
      TELEGRAM_SEND_GATE_MIN_HUMAN_MESSAGES: ${{ vars.TELEGRAM_SEND_GATE_MIN_HUMAN_MESSAGES || '1' }}
      TELEGRAM_SEND_GATE_ON_ERROR: ${{ vars.TELEGRAM_SEND_GATE_ON_ERROR || 'skip' }}
    defaults:
      run:
        working-directory: ./.github/workflows/recommend_yotas_issues

    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: get yotas issues
        shell: bash
        run: |
          GITHUB_TOKEN=${{ secrets.BOT_GITHUB_TOKEN }} ./get_yotas_issues.sh > yotas_issues_message

      - name: check if osscameroon group allows bot posting
        id: telegram_send_gate_yotas_issues
        continue-on-error: true
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_OSSCAMEROON_GROUP_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: ./.github/workflows/telegram_send_gate.sh

      - name: send custom message with to osscameroon channel
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_OSSCAMEROON_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_file: ./.github/workflows/recommend_yotas_issues/yotas_issues_message

      - name: send custom message with to osscameroon group
        if: ${{ steps.telegram_send_gate_yotas_issues.outputs.telegram_send_gate == 'true' }}
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_OSSCAMEROON_GROUP_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_file: ./.github/workflows/recommend_yotas_issues/yotas_issues_message
