# ---

name: telegram jobs report
on:
  schedule:
    - cron: "0 15 * * 1"

jobs:
  build:
    env:
      TELEGRAM_SEND_GATE_ENABLED: ${{ vars.TELEGRAM_SEND_GATE_ENABLED || 'true' }}
      TELEGRAM_SEND_GATE_LOOKBACK_MESSAGES: ${{ vars.TELEGRAM_SEND_GATE_LOOKBACK_MESSAGES || '5' }}
      TELEGRAM_SEND_GATE_MIN_HUMAN_MESSAGES: ${{ vars.TELEGRAM_SEND_GATE_MIN_HUMAN_MESSAGES || '1' }}
      TELEGRAM_SEND_GATE_ON_ERROR: ${{ vars.TELEGRAM_SEND_GATE_ON_ERROR || 'skip' }}
    defaults:
      run:
        working-directory: ./.github/workflows/report_jobs

    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: get available jobs
        shell: bash
        run: |
          ./report_jobs.sh > report_jobs &&
          cat report_jobs

      - name: check if remotejobs group allows bot posting
        id: telegram_send_gate_jobs
        continue-on-error: true
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_REMOTEJOBS_GROUP_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: ./.github/workflows/telegram_send_gate.sh

      - name: send jobs report to osscameroon group
        if: ${{ steps.telegram_send_gate_jobs.outputs.telegram_send_gate == 'true' }}
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_REMOTEJOBS_GROUP_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_file: ./.github/workflows/report_jobs/report_jobs
